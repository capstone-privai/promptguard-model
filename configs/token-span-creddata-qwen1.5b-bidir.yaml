# CredData-trajectory v1, Qwen2.5-Coder-1.5B-Instruct as a bidirectional BIO token classifier.
# The size series of configs/token-span-creddata-qwen-bidir.yaml (0.5B): data, windows, seed, LoRA, learning
# rate, schedule, epochs, selection and bidirectional attention are the same, so the runs differ in model size.
# Precision is also the 0.5B run's (float32 base, float16 autocast), so a T4 (16 GB) is enough.
model_name: Qwen/Qwen2.5-Coder-1.5B-Instruct
revision: null  # resolved commit is written to run.json; pin it here after the first run
local_files_only: false
data_dir: runs/data/span-creddata-traj-v1
output_dir: runs/token-span/creddata-qwen1.5b-bidir
device: auto
seed: 110
epochs: 3
patience: 3
batch_size: 4
learning_rate: 0.0002
weight_decay: 0.0
schedule: cosine
warmup_ratio: 0.05
max_grad_norm: 1.0
class_weights: [1.0, 2.0, 2.0]
max_length: 512
stride: 128
fp16: true
gradient_checkpointing: true
bidirectional: true
attn_implementation: sdpa
lora:
  r: 16
  alpha: 32
  dropout: 0.05
  target_modules: [q_proj, k_proj, v_proj, o_proj, gate_proj, up_proj, down_proj]
  modules_to_save: [score]
save_every: 0
save_every_minutes: 30  # resumable checkpoint (LoRA + head + optimizer, ~0.1 GB); each save leaves the old one in Drive trash
log_every: 500
eval_batch_size: 32
