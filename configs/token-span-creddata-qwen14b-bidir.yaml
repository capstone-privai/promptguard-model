# CredData-trajectory v1, Qwen2.5-Coder-14B-Instruct as a bidirectional BIO token classifier: the 2nd-stage
# (on-premises) candidate.
# The size series of configs/token-span-creddata-qwen-bidir.yaml (0.5B): data, windows, seed, LoRA, learning
# rate, schedule, epochs, selection and bidirectional attention are the same, so the runs differ in model size.
# Except precision, as in the 7B config: bfloat16 base (~30 GB) with bfloat16 autocast. Needs an A100 40 GB or
# larger. On a 24 GB GPU use --set load_in_4bit=true (QLoRA, needs bitsandbytes); that changes the comparison,
# so record it with the result.
model_name: Qwen/Qwen2.5-Coder-14B-Instruct
revision: aedcc2d42b622764e023cf882b6652e646b95671  # resolved by the first run (Colab A100, 2026-11-21)
local_files_only: false
data_dir: runs/data/span-creddata-traj-v1
output_dir: runs/token-span/creddata-qwen14b-bidir
device: auto
seed: 110
epochs: 3
patience: 3
batch_size: 4
learning_rate: 0.0002
weight_decay: 0.0
schedule: cosine
warmup_ratio: 0.05
max_grad_norm: 1.0
class_weights: [1.0, 2.0, 2.0]
max_length: 512
stride: 128
torch_dtype: bfloat16  # the frozen base; LoRA and the head stay float32
bf16: true  # bfloat16 autocast: needs an A100/L4/H100, not a T4
gradient_checkpointing: true
bidirectional: true
attn_implementation: sdpa
lora:
  r: 16
  alpha: 32
  dropout: 0.05
  target_modules: [q_proj, k_proj, v_proj, o_proj, gate_proj, up_proj, down_proj]
  modules_to_save: [score]
save_every: 0
save_every_minutes: 30  # resumable checkpoint (LoRA + head + optimizer, ~0.1 GB); each save leaves the old one in Drive trash
log_every: 500
eval_batch_size: 32
