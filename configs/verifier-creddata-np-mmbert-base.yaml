# CredData-trajectory v1 plus NoseyParker-trajectory v1 train: configs/verifier-creddata-mmbert-base.yaml with only the data, the output and the
# model version changed. Candidates come from runs/data/span-creddata-np-traj-v1 through the same detector
# (promptguard-claude-demoV0 668c2c1, CredSweeper 1.19.0, gitleaks 8.30.1: scripts/colab_verifier.sh prepare np).
# Back-end verifier, 1st stage (local): mmBERT-base as the candidate-v1 classifier (src/privai_model/training) on the
# detector's ambiguous candidates in CredData-trajectory v1 (scripts/prepare_verifier_candidates.py). P(MASK) per
# candidate; strong candidates are masked without it. Split: the span rows' split by group (split_manifest), so the
# verifier never trains on a group the token-span models were tested on. Epoch by validation loss, thresholds at
# recall 0.95 / 0.99 on validation. Test stays closed here (evaluate_test: false); scripts/final_evaluate.py scores it
# once after the run is frozen.
model_name: jhu-clsp/mmBERT-base
revision_model_name: jhu-clsp/mmBERT-base
revision: c5955035435e2bf121cde7f3c8863ef52ff35d82  # resolved by the first run (Colab T4, 2026-11-23); the token-span mmBERT-base uses the same
model_version: verifier-creddata-np-mmbert-base-v0
data_path: runs/data/verifier-creddata-np-traj-v1/ambiguous/candidates.jsonl.gz
split_manifest: runs/data/verifier-creddata-np-traj-v1/ambiguous/split_manifest.json
output_dir: runs/verifier/creddata-np-mmbert-base
seed: 42
split_ratios: [0.8, 0.1, 0.1]  # unused: split_manifest fixes the split
window_size: 256
batch_size: 8
epochs: 3
learning_rate: 2.0e-05
weight_decay: 0.01
device: auto
attention_implementation: eager
local_files_only: false
deterministic: false  # CUDA NLLLoss (cross entropy) has no deterministic kernel: deterministic mode stops GPU training. Seeds stay fixed.
class_weights: null
sampling: none
character_features: false
recall_targets: [0.95, 0.99]
deployment_recall_target: 0.99
evaluate_test: false
