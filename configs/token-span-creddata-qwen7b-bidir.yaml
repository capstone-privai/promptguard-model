# CredData-trajectory v1, Qwen2.5-Coder-7B-Instruct as a bidirectional BIO token classifier.
# The size series of configs/token-span-creddata-qwen-bidir.yaml (0.5B): data, windows, seed, LoRA, learning
# rate, schedule, epochs, selection and bidirectional attention are the same, so the runs differ in model size.
# Except precision: a float32 base (~30 GB) does not fit, so the frozen base is bfloat16 (~15 GB) with bfloat16
# autocast. Needs a bfloat16 GPU with 24 GB or more (L4, A100).
model_name: Qwen/Qwen2.5-Coder-7B-Instruct
revision: c03e6d358207e414f1eca0bb1891e29f1db0e242  # resolved by the first run (Colab L4, 2026-11-20)
local_files_only: false
data_dir: runs/data/span-creddata-traj-v1
output_dir: runs/token-span/creddata-qwen7b-bidir
device: auto
seed: 110
epochs: 3
patience: 3
batch_size: 4
learning_rate: 0.0002
weight_decay: 0.0
schedule: cosine
warmup_ratio: 0.05
max_grad_norm: 1.0
class_weights: [1.0, 2.0, 2.0]
max_length: 512
stride: 128
torch_dtype: bfloat16  # the frozen base; LoRA and the head stay float32
bf16: true  # bfloat16 autocast: needs an A100/L4/H100, not a T4
gradient_checkpointing: true
bidirectional: true
attn_implementation: sdpa
lora:
  r: 16
  alpha: 32
  dropout: 0.05
  target_modules: [q_proj, k_proj, v_proj, o_proj, gate_proj, up_proj, down_proj]
  modules_to_save: [score]
save_every: 0
save_every_minutes: 30  # resumable checkpoint (LoRA + head + optimizer, ~0.1 GB); each save leaves the old one in Drive trash
log_every: 500
eval_batch_size: 32
